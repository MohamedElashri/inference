config:
  default_timeout: 1200 # seconds
  profile_device: "a5000"

  # args added for specific test keys
  args:
    # Added to Allen command always
    base: "--params external/ParamFiles/"

    # added if "dataset:" specified
    dataset: "--mdf /scratch/allen_data/mdf_input/{dataset}.mdf"

    # added if "sequence:" specified
    sequence: "--sequence {sequence}.json"

    # added if "geometry:" specified
    geometry: "-g ../input/allen_geometries/{geometry}"

  # args added for specific specific test types
  test_args:
    throughput: "" # handled by target_args

  # args added for specific device targets
  target_args:
    throughput:
      pp:
        CUDA: "-n 500 -m 500 -r 1000 -t 16"
        CUDAPROF: "-n 500 -m 500 -r 1 -t 1"
      PbPb:
        CUDA: "-n 500 -m 2000 -r 200 -t 6 --events-per-slice 200"
        CUDAPROF: "-n 500 -m 2000 -r 1 -t 1 --events-per-slice 300"

# NOT GITLAB CI YAML !

minimal:
  - type: "throughput"
    sequence:
      - hlt1_pp_default     #mapped to the sequence used in operations "hlt1_pp_forward_then_matching_and_downstream_with_parkf_1200kHz"
    dataset: "MEP_2025_pp_pD2_bu_321834_LHCb_ECEB01_BU_0"
    geometry: "geometry_run3_2025-v00.01"

full:
  ####################################Throughput tests
  - type: "throughput" #on exp24 MC
    sequence:
      - hlt1_pp_veloSP
      - hlt1_pp_forward_then_matching_and_downstream_veloSP
    dataset: "Beam6800GeV-expected-2024-MagDown-nu7.6_MinBiasMD"
    geometry: "geometry_dddb-20231017_sim-20231017-vc-md100_new_SciFi_geometry"

  # run throughput, 50% lumi events
  - type: "throughput"
    sequence:
      - hlt1_pp_lumi
    dataset: "MEP_2025_pp_pD2_bu_321834_LHCb_ECEB01_BU_0"
    geometry: "geometry_run3_2025-v00.01"
    throughput_report: false # don't publish throughput report

  # run throughput, various settings
  - type: "throughput"
    sequence:
      - hlt1_pp_forward
      - hlt1_pp_matching
      - hlt1_pp_forward_then_matching
      - hlt1_pp_forward_then_matching_no_ut
      - hlt1_pp_forward_then_matching_and_downstream
      - hlt1_pp_forward_then_matching_with_parkf
      - hlt1_pp_forward_then_matching_and_downstream_with_parkf_rich
      - hlt1_pp_forward_then_matching_and_downstream_with_parkf_rich_from_cones
      - hlt1_pp_2025_ttracks
    dataset: "MEP_2025_pp_pD2_bu_321834_LHCb_ECEB01_BU_0" # we should keep this one properly updated!
    geometry: "geometry_run3_2025-v00.01"

  # run throughput, default, SMOG2_pppAr, exp 2024 conditions
  - type: "throughput"
    sequence:
      - hlt1_pp_default
    dataset: "SMOG2_pppAr_exp2024_mdf_sim-20231017-vc-md100_5k"
    geometry: "SMOG2_exp2024"

  # run throughput, pp reference run, exp 2024 conditions
  - type: "throughput"
    sequence:
      - hlt1_pp_ref_forward_then_matching
    dataset: "Beam2680GeV-expected-2024-MagDown-nu3.5_MinBiasMD"
    geometry: "geometry_dddb-20240427_sim10-2024.Q1.2-v1.1-md100"

  # run throughput, pp reference run, SMOG2 pp+pAr, expected 2024 conditions
  - type: "throughput"
    sequence:
    - hlt1_pp_ref_forward_then_matching
    dataset: "ppArBeam2680GeV-expected-2024-MagDown-nu3.5-nu0.37_MinBiasMD"
    geometry: "geometry_dddb-20240427_sim10-2024.Q1.2-v1.1-md100"

  # run throughput, pp 2026 low energy run sequence, pp 2026 1.2 TeV MC exp conditions
  - type: "throughput"
    sequence:
      - hlt1_pp_lowenergy_forward_then_matching_with_parkf_SMOGMBunprescaled
    dataset: "Converted_MC_pp1200GeV_NOSMOG_10kevents_00372315_00000001_1"
    geometry: "geometry_2026-v00.00_sim10-2026.W17-v00.00-md100"

  # run throughput, PbPb samples, 2024 default PbPb sequence
  - type: "throughput"
    sequence:
      - hlt1_PbPb_PbSMOG
    dataset: "official-expected-2024-PbPb-minbias-mdf"
    geometry: "geometry_dddb-20231017_sim-20231017-vc-md100"
    timeout: 2400
    collision_type: "PbPb"
    allowed_devices:
      - a5000
      - geforcertx3090

  # run throughput, PbAr sample, 2024 no-gec PbPb sequence
  - type: "throughput"
    sequence:
      - hlt1_PbPb_PbSMOG
    dataset: "official-expected-2024-PbAr-minbias-mdf"
    geometry: "geometry_dddb-20231017_sim-20231017-vc-md100"
    timeout: 2400
    collision_type: "PbPb"
    allowed_devices:
      - a5000
      - geforcertx3090

  # run throughput, OO samples, 2025 default OO sequence
  # Just use PbPb running options.
  - type: "throughput"
    sequence:
      - hlt1_LightIon_IonSMOG_veloSP
    dataset: "official-expected-2025-OO-minbias"
    geometry: "geometry_2025-v00.02_sim10-2025-v00.01-mu100"
    timeout: 2400
    collision_type: "PbPb"
    allowed_devices:
      - a5000
      - geforcertx3090
