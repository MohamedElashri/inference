# Entire workflow is defined here

include: "scripts/ci/config/common.yaml"

# builds + runs tests

build:
  extends:
    - .build_job
    - .default_rules
    - .build_job_minimal_matrix
  stage: build

check-warnings:
  extends:
    - .default_rules
    - .build_job_minimal_matrix
  stage: check-warnings
  tags: [cvmfs]
  script:
    - source scripts/ci/common.sh
    - cd "${BUILD_FOLDER}" && ls
    - "if [[ $(cat build.log | grep warning -i) ]]; then cat build.log | grep warning -i; exit 1; fi"
  allow_failure: true

.run_job:
  extends: .run_jobs_minimal
  stage: run


# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# Configuration of jobs for each device                     #
# All devices to run in the minimal pipeline should be      #
# included here                                             #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

geforcertx3090:
  extends:
    - .geforcertx3090
    - .run_job

geforcertx2080ti:
  extends:
    - .geforcertx2080ti
    - .run_job

a5000:
  extends:
    - .a5000
    - .run_job

.device-jobs:
  dependencies:
    - a5000
    - geforcertx2080ti
    - geforcertx3090


# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# test and publish stages for the minimal pipeline          #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

physics-efficiency:
  stage: test
  extends:
    - .test_physics_efficiency
    - .default_rules_always_run
    - .device-jobs


# run-changes:
#   stage: test
#   extends:
#     - .test_run_changes
#     - .default_rules_always_run
#   needs:
#     - a5000


throughput:
  extends:
    - .publish_test_throughput
    - .default_rules_always_run
  stage: test
  variables:
    PUBLISH_ARTIFACT_NAME: "test_throughput"
    TEST_NAME: "test_throughput"

  artifacts:
    name: "$PUBLISH_ARTIFACT_NAME"
    paths:
      - devices_throughputs_*.csv
      - test_throughput_details/*.txt
      - test_throughput_details/*.csv
    expire_in: 1 month
    when: always


pub-throughput:
  stage: publish
  extends:
    - .publish_test_throughput
    - .default_rules_always_run
  variables:
    PUBLISH_ARTIFACT_NAME: "test_throughput"
    TEST_NAME: "publish_throughput"
    REFERENCE_JOB: "throughput"

  needs: [throughput]

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# manual trigger job for the full pipeline                  #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #


# Blocks the full pipeline from being triggered automatically
# in Merge Requests
# Does not block for master, web, schedules
full-pipeline:
  variables:
    GIT_STRATEGY: none
  stage: "manual trigger"
  script:
    - exit
  rules:
    - if: '$CI_PROJECT_ROOT_NAMESPACE != "lhcb"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "2024-patches")'
    - when: never
  needs: []


# separate build jobs for CPU, CUDA, HIP targets

.full-build:
  needs: [full-pipeline]
  stage: "build full"
  extends:
    - .default_rules
    - .build_job
    - .build_job_additional_matrix
  timeout: 1h 30m

CPU:
  extends: .full-build
  variables:
    LCG_QUALIFIER: "cpu"

CUDA:
  extends: .full-build
  variables:
    LCG_QUALIFIER: "cuda12_4"

# HIP:
#   extends: .full-build
#   variables:
#     LCG_QUALIFIER: hip5



# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# Configuration of jobs for each device                     #
# All devices to run in the full pipeline should be         #
# included here                                             #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

# N.B. if needs: refers to more than 50 jobs and throws an error, try using
# dependencies: instead.

.cpu_run_job:
  dependencies: [CPU, build]
  variables:
    LCG_QUALIFIER: "cpu"

.cuda_run_job:
  dependencies: [CUDA, build]
  variables:
    LCG_QUALIFIER: cuda12_4

# .hip_run_job:
#   dependencies: [HIP, build]
#   variables:
#     LCG_QUALIFIER: hip5

# GPU / CUDA
# RTX 3090
geforcertx3090-full:
  extends:
    - .geforcertx3090
    - .run_jobs
    - .default_rules_always_run
    - .cuda_run_job

# A5000
a5000-full:
  extends:
    - .a5000
    - .run_jobs
    - .default_rules_always_run
    - .cuda_run_job
  timeout: 1h 30m


# RTX 2080Ti
geforcertx2080ti-full:
  extends:
    - .geforcertx2080ti
    - .run_jobs
    - .default_rules_always_run
    - .cuda_run_job


# HIP

# add any jobs listed above to this list
# (stops build artifacts being downloaded to full test and publish jobs)
# full-run-changes should be added to the needs: list in run-changes-full
.depend_full_jobs:
  # N.B. dependencies: is used instead of needs:, as the needs: job limit
  # is 50. See https://docs.gitlab.com/ee/ci/yaml/#changing-the-needs-job-limit
  dependencies:
    # CUDA
    - geforcertx3090-full
    - geforcertx2080ti-full
    - a5000-full


# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# test and publish jobs for full pipeline

physics-efficiency-full:
  stage: test full
  extends:
    - .test_physics_efficiency
    - .default_rules_always_run
    - .depend_full_jobs

